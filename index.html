<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Railway Chainage Explorer (Network Rail)</title>
  <meta name="theme-color" content="#0d47a1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    body { font-family: "Inter", "Segoe UI", Arial, sans-serif; }
  </style>
  <script>
    // Canonical domain: avoid multiple Vercel URLs confusing users.
    // Note: Vercel may still keep the "extra" URL alive, but this will redirect traffic to the one you want.
    (function () {
      const CANONICAL_HOST = 'github-repository-gamma.vercel.app';
      const UNWANTED_HOST = 'github-repository-plinios-projects-c209bcd0.vercel.app';
      if (window.location.hostname === UNWANTED_HOST) {
        const target =
          window.location.protocol +
          '//' +
          CANONICAL_HOST +
          window.location.pathname +
          window.location.search +
          window.location.hash;
        window.location.replace(target);
      }
    })();

    // Mapbox token used by map.js
    window.MAPBOX_TOKEN = 'pk.eyJ1IjoicGxpbmlvLXBpY2NpbiIsImEiOiJjbWh0NWFwN20xOWIyMmtyNHJ1M3AyZXJzIn0.nv6q66EUGokaNIM92SK-1g';
  </script>
</head>
<body>
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.10.0/dist/proj4.js"></script>
  <script src="map.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const isLocalhost =
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === '[::1]';
        if (isLocalhost) {
          console.log('Service worker disabled on localhost (dev mode).');
          // If you previously loaded this site with the service worker enabled,
          // it may still be controlling localhost and serving cached files.
          // Unregister + clear caches to ensure you see the latest local changes.
          if (navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((reg) => reg.unregister()));
          }
          if (window.caches?.keys) {
            window.caches.keys().then((keys) => keys.forEach((key) => window.caches.delete(key)));
          }
          return;
        }

        navigator.serviceWorker
          // Use a relative URL so GitHub Pages deployments under /<repo>/ work.
          .register('service-worker.js')
          .then(() => console.log('Service worker registered'))
          .catch((err) => console.error('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
